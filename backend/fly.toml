# fly.toml app configuration file generated for ai-advisor-backend-dr on 2025-10-07T13:40:34+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ai-advisor-backend-dr'
primary_region = 'bom'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[http_service.checks]]
  interval = "10s"      # How often to run the check
  timeout = "2s"        # How long to wait for a response
  grace_period = "5s"   # A delay after startup before checks begin
  method = "get"        # The HTTP method to use
  path = "/"            # The path to check. Our root endpoint is perfect for this.
  protocol = "http"     # The protocol inside the private network

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
